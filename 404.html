<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Nitsan Kolko</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --fg:#f2f1ec; --muted:#8c8c86;
    --line:rgba(242,241,236,.14);
    --accent:#c8a368; --accent-dim:rgba(200,163,104,.45);
    --font:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --pad:clamp(20px,5vw,64px);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:400;
    font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
    min-height:100svh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  header{padding:0 var(--pad);height:72px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
  header .name{font-family:var(--serif);font-size:19px;font-weight:480}
  main{flex:1;display:flex;align-items:center;padding:60px var(--pad)}
  .inner{max-width:760px}
  .code{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .code::before{content:"";width:22px;height:1px;background:var(--accent)}
  h1{font-family:var(--serif);font-weight:340;font-style:italic;letter-spacing:-.02em;
    font-size:clamp(3.4rem,11vw,7.5rem);line-height:.98}
  h1 .dot{color:var(--accent);font-style:normal}
  p{margin-top:26px;color:var(--muted);font-weight:300;max-width:46ch}
  .back{display:inline-block;margin-top:38px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--fg);padding-bottom:4px;border-bottom:1px solid var(--accent-dim);transition:border-color .25s}
  .back:hover,.back:focus-visible{border-color:var(--accent)}
  footer{padding:28px var(--pad);border-top:1px solid var(--line);
    font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<header><a class="name" href="/">Nitsan Kolko</a></header>
<main>
  <div class="inner">
    <span class="code">404 — Page not found</span>
    <h1>Off the page<span class="dot">.</span></h1>
    <p>This page doesn't exist — it may have moved, or the link is out of tune. Everything worth hearing is still here.</p>
    <a class="back" href="/">Back to the homepage</a>
  </div>
</main>
<footer>© <span id="yr"></span> Nitsan Kolko</footer>
<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
